<!doctype html>
<!--
  Widget capability probe (MCP Apps) — TEMPORARY, for the bulk-import spike.

  Answers the questions that decide whether the import widget can do its job,
  and that cannot be answered outside a real host:

    1. Does the host advertise hostCapabilities.serverTools?
    2. Does an app-initiated tools/call actually reach the server and come back?
    3. Does the host prompt the user for approval per call? (Time each call: a
       prompt shows up as multi-second latency plus a visible dialog.)
    4. Does the host impose hostContext.containerDimensions (fixed/max height)?
    5. Do sequential calls work, and at what pace?

  Now drives the SHARED bridge client (api.callTool) rather than its own copy —
  so running this also verifies the code the import widget will rely on.

  MCP Inspector results (2026-07-25): serverTools yes, containerDimensions none,
  round-trip 839ms cold then ~370ms steady, three sequential calls with no
  approval prompt.

  Registered only when ENABLE_WIDGET_PROBE is set, so merging this is inert.
  Delete the template, the WIDGET_TEMPLATES entry, and the tool once the spike
  has answered the questions above for the shipping hosts.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Widget Capability Probe</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/form.css@*/

            .probe-row {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                padding: 7px 0;
                border-bottom: 1px solid var(--panel-border);
                font-size: 13px;
            }
            .probe-row:last-child {
                border-bottom: none;
            }
            .probe-k {
                color: var(--text-dim);
            }
            .probe-v {
                font-weight: 600;
                text-align: right;
                word-break: break-word;
            }
            .yes {
                color: var(--accent);
            }
            .no {
                color: var(--over);
            }
            .probe-log {
                margin-top: 10px;
                padding: 8px;
                border-radius: 8px;
                background: var(--panel);
                border: 1px solid var(--panel-border);
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 11px;
                line-height: 1.5;
                white-space: pre-wrap;
                max-height: 220px;
                overflow: auto;
            }
            .probe-card {
                padding: 14px;
                margin: 12px;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            /*@include shared/bridge.js@*/

            const lines = [];
            let API = null;

            function log(msg) {
                const t = new Date().toISOString().slice(11, 23);
                lines.push(`${t}  ${msg}`);
                if (lines.length > 60) lines.shift();
                repaint();
            }

            function esc(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }
            function flag(v) {
                if (v === null || v === undefined)
                    return '<span class="probe-v">unknown</span>';
                return v
                    ? '<span class="probe-v yes">yes</span>'
                    : '<span class="probe-v no">no</span>';
            }
            function row(k, vHtml) {
                return `<div class="probe-row"><span class="probe-k">${esc(k)}</span>${vHtml}</div>`;
            }

            // One timed call through the SHARED bridge client.
            async function timedCall(label, timeoutMs) {
                if (!API) return log("!! bridge not ready");
                const started = performance.now();
                log(`-> ${label} tools/call get_goal_progress`);
                try {
                    const res = await API.callTool(
                        "get_goal_progress",
                        {},
                        timeoutMs ? { timeoutMs } : undefined,
                    );
                    const ms = Math.round(performance.now() - started);
                    log(
                        `<- ok (${ms}ms) structured=${!!res.structuredContent}`,
                    );
                    if (ms > 1500) {
                        log(
                            `   NOTE ${ms}ms is slow for a read — a per-call approval prompt is likely.`,
                        );
                    }
                } catch (e) {
                    const ms = Math.round(performance.now() - started);
                    log(`!! failed after ${ms}ms: ${e.message}`);
                }
            }

            function repaint() {
                const el = document.getElementById("root");
                if (!el) return;
                const dims =
                    API &&
                    API.hostContext &&
                    API.hostContext.containerDimensions;
                el.innerHTML = `
          <div class="card probe-card">
            <h2 style="margin:0 0 8px;font-size:15px">Widget capability probe</h2>
            ${row("in a host", flag(window.parent !== window))}
            ${row("handshake completed", flag(!!API))}
            ${row("hostCapabilities.serverTools", flag(API ? API.canCallTools : null))}
            ${row(
                "containerDimensions",
                `<span class="probe-v">${esc(dims ? JSON.stringify(dims) : "none")}</span>`,
            )}
            ${row(
                "host",
                `<span class="probe-v">${esc(
                    (API && API.hostInfo && API.hostInfo.name) || "unknown",
                )}</span>`,
            )}
            <div class="actions">
              <button class="btn btn-primary" id="p1">1 read call</button>
              <button class="btn" id="p2">3 sequential calls</button>
              <button class="btn" id="p4">timeout test (3s)</button>
              <button class="btn" id="p5">push model context</button>
              <button class="btn" id="p3">clear log</button>
            </div>
            <div class="probe-log">${esc(lines.join("\n")) || "no activity yet"}</div>
          </div>`;
                const b1 = document.getElementById("p1");
                const b2 = document.getElementById("p2");
                const b3 = document.getElementById("p3");
                const b4 = document.getElementById("p4");
                const b5 = document.getElementById("p5");
                if (b1) b1.onclick = () => timedCall("single");
                if (b2)
                    b2.onclick = async () => {
                        for (let i = 1; i <= 3; i++)
                            await timedCall(`seq ${i}`);
                    };
                // Detects a host that accepts tools/call but never answers —
                // the failure mode that otherwise looks like a hung widget.
                if (b4) b4.onclick = () => timedCall("timeout-probe", 3000);
                // Does the host accept ui/update-model-context? Silent failure
                // here means the model never learns what the widget did.
                if (b5)
                    b5.onclick = async () => {
                        log("-> ui/update-model-context");
                        await API.updateModelContext(
                            "Probe pushed a summary into model context.",
                        );
                        log("<- update-model-context settled");
                    };
                if (b3)
                    b3.onclick = () => {
                        lines.length = 0;
                        repaint();
                    };
            }

            initWidget({
                name: "import-probe-widget",
                loading: '<div class="empty">Probing host capabilities…</div>',
                // The probe's own UI is the point; tool data is irrelevant to it.
                coerce: () => ({ probe: true }),
                render: () => repaint(),
                sample: { probe: true },
                onReady: (api) => {
                    API = api;
                    log(
                        `handshake ok — serverTools=${api.canCallTools} host=${
                            (api.hostInfo && api.hostInfo.name) || "unknown"
                        }`,
                    );
                    repaint();
                },
            });

            // Paint immediately: useful before any tool result arrives, and in a
            // host the bridge only paints on tool-result.
            repaint();
        </script>
    </body>
</html>
